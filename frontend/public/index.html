<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssistantMedixa - Agentic AI Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white">

  <!-- APP ROOT CONTAINER -->
  <div id="app" class="h-screen w-screen flex flex-col overflow-hidden"></div>

  <script>
    const state = {
      token: localStorage.getItem('access_token') || '',
      role: localStorage.getItem('user_role') || '',
      userName: localStorage.getItem('user_name') || '',
      email: localStorage.getItem('user_email') || '',
      patients: [],
      selectedPatient: '',
      sessions: [],
      activeSessionId: '',
      messages: [],
      executing: false,
      steps: [],
      knowledgeItems: [],
      knowledgeStats: { totalItems: 0, totalVectors: 0 }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (!state.token) {
        renderLogin();
      } else if (state.role === 'admin') {
        renderAdmin();
      } else {
        renderDoctor();
      }
    });

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.token}`
      };
    }

    // ==========================================
    // LOGIN SCREEN
    // ==========================================
    function renderLogin(errorMsg = '') {
      const app = document.getElementById('app');
      app.className = "flex min-h-screen items-center justify-center bg-slate-950 p-4 relative overflow-hidden";
      app.innerHTML = `
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl"></div>

        <div class="w-full max-w-md glass rounded-2xl p-8 shadow-2xl z-10">
          <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold uppercase tracking-wider mb-4">
              📚 Dedicated RAG & Knowledge Suite
            </div>
            <h1 className="text-3xl font-extrabold text-white mb-2">AssistantMedixa Portal</h1>
            <p className="text-sm text-slate-400">Agentic AI Clinical Platform & SIMRS / Satu Sehat</p>
          </div>

          ${errorMsg ? `<div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm">${errorMsg}</div>` : ''}

          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
              <input type="email" id="emailInput" required placeholder="doctor@AssistantMedixa.com"
                class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
              <input type="password" id="passwordInput" required placeholder="••••••••"
                class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <button type="submit"
              class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-lg shadow-lg transition transform active:scale-95">
              Sign In to Workspace
            </button>
          </form>

          <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-400 mb-3">Quick Demo Authentication Buttons:</p>
            <div class="flex gap-2">
              <button onclick="quickLogin('doctor@AssistantMedixa.com', 'doctor123')"
                class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 rounded-lg border border-slate-700 transition">
                🩺 Doctor Login
              </button>
              <button onclick="quickLogin('admin@AssistantMedixa.com', 'admin123')"
                class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 rounded-lg border border-slate-700 transition">
                ⚙️ Admin Login
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        performLogin(email, password);
      });
    }

    async function quickLogin(email, password) {
      document.getElementById('emailInput').value = email;
      document.getElementById('passwordInput').value = password;
      performLogin(email, password);
    }

    async function performLogin(email, password) {
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Authentication failed');

        state.token = data.access_token;
        state.role = data.role;
        state.userName = data.name;
        state.email = data.email;

        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user_role', data.role);
        localStorage.setItem('user_name', data.name);
        localStorage.setItem('user_email', data.email);

        if (state.role === 'admin') {
          renderAdmin();
        } else {
          renderDoctor();
        }
      } catch (err) {
        renderLogin(err.message);
      }
    }

    function logout() {
      localStorage.clear();
      state.token = '';
      state.role = '';
      renderLogin();
    }

    // ==========================================
    // DOCTOR WORKSPACE
    // ==========================================
    async function renderDoctor() {
      const app = document.getElementById('app');
      app.className = "flex h-screen bg-slate-950 text-slate-100 overflow-hidden";

      app.innerHTML = `
        <!-- Sidebar -->
        <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
          <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xl">🩺</span>
              <span class="font-bold text-slate-100">Medical AI Co-Pilot</span>
            </div>
            <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400">Logout</button>
          </div>

          <div class="p-4 border-b border-slate-800">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Active SIMRS Patient (MRN)</label>
            <select id="patientSelect" onchange="state.selectedPatient = this.value"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:border-blue-500">
              <option value="">-- General Consultation (No MRN selected) --</option>
            </select>
          </div>

          <div class="flex-1 overflow-y-auto p-3 space-y-1" id="sessionList">
            <div class="text-xs font-semibold text-slate-400 px-2 py-1">Saved Consultations</div>
          </div>

          <div class="p-4 border-t border-slate-800 text-xs text-slate-400 flex justify-between items-center">
            <div>Logged in: <span class="text-slate-200 font-semibold">${state.userName}</span></div>
            ${state.role === 'admin' ? `<button onclick="renderAdmin()" class="text-blue-400 hover:underline">Admin Panel</button>` : ''}
          </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col bg-slate-950">
          <header class="px-6 py-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
            <div>
              <h2 class="font-bold text-lg text-white">Clinical Workspace & SIMRS Integration</h2>
              <p class="text-xs text-slate-400">LangGraph Multi-Agent + SIMRS / Satu Sehat + Dedicated Qdrant RAG Module</p>
            </div>
            <div class="flex gap-2">
              <button onclick="renderKnowledgeManagement()" className="px-3 py-1 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-400 text-xs font-medium rounded-lg transition flex items-center gap-1">
                📚 Knowledge Management Suite
              </button>
              <div class="px-3 py-1 bg-purple-500/10 border border-purple-500/20 rounded-full text-purple-400 text-xs font-medium flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
                🔌 SIMRS / Satu Sehat Protocol
              </div>
            </div>
          </header>

          <div id="messageThread" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="text-center py-16 text-slate-400">
              <div class="text-4xl mb-3">🤖</div>
              <h3 class="text-lg font-semibold text-slate-200">How can I assist your clinical evaluation today?</h3>
              <p class="text-xs max-w-md mx-auto mt-2">
                Select a patient record to fetch SIMRS demographics (NIK, BPJS, history) via Model Context Protocol or query Qdrant RAG medical guidelines.
              </p>
            </div>
          </div>

          <!-- Input Bar -->
          <div class="p-4 border-t border-slate-800 bg-slate-900/50">
            <!-- Template Pills -->
            <div class="flex gap-2 mb-3 overflow-x-auto pb-1 text-xs">
              <button onclick="setPrompt('Fetch SIMRS patient history and check Lisinopril contraindications.')"
                class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full border border-slate-700 whitespace-nowrap">
                🏥 SIMRS Profile & Lisinopril Screen
              </button>
              <button onclick="setPrompt('Update SIMRS EMR record with CKD Stage 3a monitoring plan.')"
                class="px-3 py-1 bg-purple-900/40 hover:bg-purple-800/60 text-purple-300 rounded-full border border-purple-700/50 whitespace-nowrap font-medium">
                ⚙️ Update SIMRS EMR Record
              </button>
              <button onclick="setPrompt('What are the ADA 2025 guidelines for Metformin eGFR cutoffs (RxNorm 6809)?')"
                class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full border border-slate-700 whitespace-nowrap">
                📚 Metformin & eGFR Cutoffs
              </button>
            </div>

            <div class="max-w-4xl mx-auto flex gap-3">
              <input type="text" id="queryInput" placeholder="Ask question, request SIMRS / Satu Sehat lookup or EMR update..."
                onkeydown="if(event.key === 'Enter') sendQuery()"
                class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-400 text-sm focus:outline-none focus:border-blue-500">
              <button onclick="sendQuery()" id="sendBtn"
                class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl text-sm transition">
                Send
              </button>
            </div>
          </div>
        </main>
      `;

      await loadPatients();
      await loadSessions();
    }

    function setPrompt(text) {
      document.getElementById('queryInput').value = text;
    }

    async function loadPatients() {
      try {
        const res = await fetch('/api/v1/agent/patients', { headers: getHeaders() });
        if (res.ok) {
          state.patients = await res.json();
          const select = document.getElementById('patientSelect');
          select.innerHTML = '<option value="">-- General Consultation (No MRN selected) --</option>';
          state.patients.forEach(p => {
            const mrn = `MRN-SIMRS-${p.patient_id.replace('P-', '')}`;
            select.innerHTML += `<option value="${p.patient_id}">${p.name} (${mrn} - Age ${p.age})</option>`;
          });
        }
      } catch (e) { console.error(e); }
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/v1/chat/sessions', { headers: getHeaders() });
        if (res.ok) {
          state.sessions = await res.json();
          const list = document.getElementById('sessionList');
          list.innerHTML = '<div class="text-xs font-semibold text-slate-400 px-2 py-1">Saved Consultations</div>';
          state.sessions.forEach(s => {
            list.innerHTML += `
              <button onclick="loadSessionMessages('${s.session_id}')"
                class="w-full text-left px-3 py-2 rounded-lg text-xs hover:bg-slate-800 text-slate-300 transition">
                <div class="font-medium truncate">${s.title}</div>
                <div class="text-[10px] text-slate-400">${new Date(s.created_at).toLocaleDateString()}</div>
              </button>
            `;
          });
          if (state.sessions.length > 0) {
            loadSessionMessages(state.sessions[0].session_id);
          }
        }
      } catch (e) { console.error(e); }
    }

    async function loadSessionMessages(sessionId) {
      state.activeSessionId = sessionId;
      try {
        const res = await fetch(`/api/v1/chat/sessions/${sessionId}`, { headers: getHeaders() });
        if (res.ok) {
          const data = await res.json();
          state.messages = data.messages || [];
          if (data.patient_id) {
            state.selectedPatient = data.patient_id;
            const select = document.getElementById('patientSelect');
            if (select) select.value = data.patient_id;
          }
          renderMessages();
        }
      } catch (e) { console.error(e); }
    }

    function renderMessages() {
      const thread = document.getElementById('messageThread');
      if (!thread) return;

      if (state.messages.length === 0) {
        thread.innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <div class="text-4xl mb-3">🤖</div>
            <h3 class="text-lg font-semibold text-slate-200">How can I assist your clinical evaluation today?</h3>
          </div>`;
        return;
      }

      thread.innerHTML = state.messages.map(m => `
        <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
          <div class="max-w-3xl rounded-2xl p-5 ${m.role === 'user'
          ? 'bg-blue-600 text-white rounded-br-none'
          : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none shadow-xl'
        }">
            <div class="text-[10px] opacity-75 mb-1 font-semibold">${m.role === 'user' ? 'Dr. Sarah Jenkins' : 'Generative AI Agent Co-Pilot (Dedicated RAG Module)'}</div>
            <div class="whitespace-pre-wrap text-sm leading-relaxed">${escapeHtml(m.content)}</div>
          </div>
        </div>
      `).join('');

      thread.scrollTop = thread.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function sendQuery() {
      const input = document.getElementById('queryInput');
      const text = input.value.trim();
      if (!text || state.executing) return;

      input.value = '';
      state.executing = true;
      document.getElementById('sendBtn').innerText = 'Executing RAG...';

      state.messages.push({ role: 'user', content: text, timestamp: new Date().toISOString() });
      renderMessages();

      const thread = document.getElementById('messageThread');
      const loaderDiv = document.createElement('div');
      loaderDiv.id = 'liveStepLoader';
      loaderDiv.className = 'p-4 bg-slate-900 border border-emerald-500/30 rounded-xl max-w-3xl animate-pulse space-y-2';
      loaderDiv.innerHTML = `
        <div class="text-xs font-semibold text-emerald-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          Dedicated RAG & MCP Agent Execution...
        </div>
        <div class="text-xs text-slate-400 space-y-1">
          <div>🔌 Calling SIMRS / Satu Sehat Protocol</div>
          <div>🎯 Dedicated Qdrant RAG Search (text-embedding-004) + Reranking</div>
          <div>✨ Generative AI 2.0 LLM Synthesis</div>
        </div>`;
      thread.appendChild(loaderDiv);
      thread.scrollTop = thread.scrollHeight;

      try {
        const res = await fetch('/api/v1/agent/chat', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            user_query: text,
            patient_id: state.selectedPatient || null,
            session_id: state.activeSessionId || null
          })
        });
        const data = await res.json();
        if (res.ok) {
          loaderDiv.remove();
          state.messages.push({ role: 'assistant', content: data.final_synthesis, timestamp: new Date().toISOString() });
          renderMessages();
          loadSessions();
        }
      } catch (e) {
        console.error(e);
      } finally {
        state.executing = false;
        document.getElementById('sendBtn').innerText = 'Send';
      }
    }

    // ==========================================
    // KNOWLEDGE MANAGEMENT SUITE UI
    // ==========================================
    async function renderKnowledgeManagement() {
      const app = document.getElementById('app');
      app.className = "min-h-screen bg-slate-950 text-slate-100 p-8 overflow-y-auto";
      app.innerHTML = `
        <header class="flex justify-between items-center mb-8 pb-6 border-b border-slate-800">
          <div>
            <h1 class="text-3xl font-extrabold text-white">Knowledge Management Suite</h1>
            <p class="text-slate-400 text-sm">Dedicated RAG Module — Qdrant Vector Indexing & Document Upload Engine</p>
          </div>
          <div class="flex items-center gap-4">
            <button onclick="renderDoctor()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition">
              🩺 Doctor Workspace
            </button>
            <button onclick="logout()" class="px-4 py-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 text-sm font-medium rounded-lg border border-red-500/30 transition">
              Sign Out
            </button>
          </div>
        </header>

        <!-- Top Metrics Cards -->
        <div id="kmMetrics" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Indexed Documents</div>
            <div class="text-3xl font-extrabold text-blue-400" id="statItemsCount">...</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total Qdrant Vectors</div>
            <div class="text-3xl font-extrabold text-emerald-400" id="statVectorsCount">...</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Embedding Engine</div>
            <div class="text-lg font-bold text-purple-400">Generative AI text-embedding-004</div>
          </div>
        </div>

        <!-- Document File Upload & Web Form Ingestion -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
          <!-- Card 1: Upload File -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
            <h2 class="text-lg font-bold text-white mb-2">📄 Upload Medical Document File</h2>
            <p class="text-xs text-slate-400 mb-4">Upload .txt, .md, .json guidelines or clinical protocols to index into Qdrant vector database.</p>
            
            <form id="uploadDocForm" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Select Document File</label>
                <input type="file" id="fileInput" required accept=".txt,.md,.json,.csv"
                  class="w-full text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded-lg p-2 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
                  <select id="uploadCategory" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                    <option value="disease">Disease</option>
                    <option value="medicine">Medicine</option>
                    <option value="terminology">Terminology</option>
                    <option value="guideline">Clinical Guideline</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Specialty</label>
                  <input type="text" id="uploadSpecialty" value="General Medicine" placeholder="e.g. Nephrology"
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                </div>
              </div>
              <button type="submit" id="uploadBtn"
                class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-lg transition">
                Upload & Index to Qdrant Vector DB
              </button>
            </form>
          </div>

          <!-- Card 2: Manual Form Data Ingestion -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
            <h2 class="text-lg font-bold text-white mb-2">📝 Input Structured Form Data</h2>
            <p class="text-xs text-slate-400 mb-4">Manually submit medical knowledge with ICD-10/RxNorm codes into Qdrant RAG.</p>
            
            <form id="knowledgeForm" class="space-y-3">
              <div>
                <input type="text" id="formTitle" required placeholder="Title (e.g. Asthma Management Guidelines)"
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 placeholder-slate-500">
              </div>
              <div class="grid grid-cols-3 gap-2">
                <select id="formCategory" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                  <option value="disease">Disease</option>
                  <option value="medicine">Medicine</option>
                  <option value="terminology">Terminology</option>
                </select>
                <input type="text" id="formSpecialty" placeholder="Specialty" value="Pulmonology"
                  class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                <input type="text" id="formIcd10" placeholder="ICD-10 Code"
                  class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
              </div>
              <div class="grid grid-cols-2 gap-2">
                <input type="text" id="formSynonyms" placeholder="Synonyms (comma separated)"
                  class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                <input type="text" id="formKeywords" placeholder="Keywords (comma separated)"
                  class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
              </div>
              <div>
                <textarea id="formContent" required rows="3" placeholder="Clinical text content & section headers..."
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 placeholder-slate-500"></textarea>
              </div>
              <button type="submit" id="formBtn"
                class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-lg transition">
                Submit Form to Qdrant Vector Collection
              </button>
            </form>
          </div>
        </div>

        <!-- Table of Indexed Documents -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
          <h2 class="text-xl font-bold text-white mb-4">Indexed Qdrant Knowledge Vector Documents</h2>
          <div className="overflow-x-auto">
            <table className="w-full text-left text-sm text-slate-300">
              <thead className="bg-slate-950 text-slate-400 uppercase text-xs">
                <tr>
                  <th className="p-3">Title</th>
                  <th className="p-3">Category</th>
                  <th className="p-3">Specialty</th>
                  <th className="p-3">Codes (ICD10 / RxNorm)</th>
                  <th className="p-3">Chunks</th>
                  <th className="p-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="knowledgeTableBody" className="divide-y divide-slate-800">
                <tr><td colSpan="6" className="p-4 text-center text-slate-400">Loading vector documents...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      loadKnowledgeData();

      // Form Submit Handler
      document.getElementById('knowledgeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('formTitle').value;
        const category = document.getElementById('formCategory').value;
        const specialty = document.getElementById('formSpecialty').value;
        const icd10_code = document.getElementById('formIcd10').value || null;
        const synonyms = document.getElementById('formSynonyms').value.split(',').map(s => s.trim()).filter(Boolean);
        const keywords = document.getElementById('formKeywords').value.split(',').map(s => s.trim()).filter(Boolean);
        const content = document.getElementById('formContent').value;

        try {
          const res = await fetch('/api/v1/rag/knowledge', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ title, category, specialty, icd10_code, synonyms, keywords, content })
          });
          if (res.ok) {
            alert('Form knowledge item indexed successfully into Qdrant!');
            loadKnowledgeData();
          }
        } catch (err) { console.error(err); }
      });

      // Upload File Form Handler
      document.getElementById('uploadDocForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files || fileInput.files.length === 0) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('category', document.getElementById('uploadCategory').value);
        formData.append('specialty', document.getElementById('uploadSpecialty').value);

        try {
          const res = await fetch('/api/v1/rag/upload-doc', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${state.token}` },
            body: formData
          });
          if (res.ok) {
            alert('Document uploaded and indexed into Qdrant!');
            loadKnowledgeData();
          }
        } catch (err) { console.error(err); }
      });
    }

    async function loadKnowledgeData() {
      try {
        const res = await fetch('/api/v1/rag/knowledge', { headers: getHeaders() });
        if (res.ok) {
          const data = await res.json();
          state.knowledgeItems = data.items;
          state.knowledgeStats = { totalItems: data.total_items, totalVectors: data.total_vectors };

          document.getElementById('statItemsCount').innerText = data.total_items;
          document.getElementById('statVectorsCount').innerText = data.total_vectors;

          const tbody = document.getElementById('knowledgeTableBody');
          tbody.innerHTML = data.items.map(item => `
            <tr>
              <td class="p-3 font-semibold text-white">${escapeHtml(item.title)}</td>
              <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${item.category === 'disease' ? 'bg-blue-500/20 text-blue-400' : item.category === 'medicine' ? 'bg-purple-500/20 text-purple-400' : 'bg-emerald-500/20 text-emerald-400'}">${item.category.toUpperCase()}</span></td>
              <td class="p-3 text-slate-400">${item.specialty}</td>
              <td class="p-3 text-slate-400">${item.icd10_code || item.rxnorm_code || item.loinc_code || '-'}</td>
              <td class="p-3 font-mono text-purple-400">${item.chunks_count} chunks</td>
              <td class="p-3 text-right">
                <button onclick="deleteKnowledgeItem('${item.id}')" class="px-3 py-1 bg-red-600/20 hover:bg-red-600/30 text-xs text-red-400 rounded border border-red-500/30">
                  Delete
                </button>
              </td>
            </tr>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    async function deleteKnowledgeItem(itemId) {
      if (!confirm('Are you sure you want to delete this document from Qdrant?')) return;
      try {
        const res = await fetch(`/api/v1/rag/knowledge/${itemId}`, {
          method: 'DELETE',
          headers: getHeaders()
        });
        if (res.ok) {
          loadKnowledgeData();
        }
      } catch (e) { console.error(e); }
    }

    // ==========================================
    // ADMIN DASHBOARD SCREEN
    // ==========================================
    async function renderAdmin() {
      const app = document.getElementById('app');
      app.className = "min-h-screen bg-slate-950 text-slate-100 p-8 overflow-y-auto";
      app.innerHTML = `
        <header class="flex justify-between items-center mb-8 pb-6 border-b border-slate-800">
          <div>
            <h1 class="text-3xl font-extrabold text-white">System Admin Dashboard</h1>
            <p class="text-slate-400 text-sm">AssistantMedixa Modular Monolith & Dedicated RAG Suite Monitor</p>
          </div>
          <div class="flex items-center gap-4">
            <button onclick="renderKnowledgeManagement()" class="px-4 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-sm font-medium rounded-lg border border-emerald-500/30 transition">
              📚 Knowledge Management Suite
            </button>
            <button onclick="renderDoctor()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition">
              🩺 Switch to Doctor Workspace
            </button>
            <button onclick="logout()" class="px-4 py-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 text-sm font-medium rounded-lg border border-red-500/30 transition">
              Sign Out
            </button>
          </div>
        </header>

        <div id="adminMetrics" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8"></div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 shadow-lg">
          <h2 class="text-xl font-bold text-white mb-4">User & Doctor Accounts</h2>
          <div id="adminUserTable"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
          <h2 class="text-xl font-bold text-white mb-4">Audit Logs & Agent Activity Stream</h2>
          <div id="adminLogsFeed" class="space-y-3 max-h-96 overflow-y-auto"></div>
        </div>
      `;

      await loadAdminData();
    }

    async function loadAdminData() {
      try {
        const [statsRes, usersRes, logsRes] = await Promise.all([
          fetch('/api/v1/admin/stats', { headers: getHeaders() }),
          fetch('/api/v1/admin/users', { headers: getHeaders() }),
          fetch('/api/v1/admin/audit-logs', { headers: getHeaders() })
        ]);

        if (statsRes.ok) {
          const stats = await statsRes.json();
          document.getElementById('adminMetrics').innerHTML = `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Registered Doctors</div>
              <div class="text-3xl font-extrabold text-blue-400">${stats.total_doctors}</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total AI Queries</div>
              <div class="text-3xl font-extrabold text-emerald-400">${stats.total_queries_run}</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Generative AI Tokens Consumed</div>
              <div class="text-3xl font-extrabold text-purple-400">${stats.total_gemini_tokens.toLocaleString()}</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active LLM Model</div>
              <div class="text-lg font-bold text-amber-400">${stats.gemini_model_active}</div>
            </div>
          `;
        }

        if (usersRes.ok) {
          const users = await usersRes.json();
          document.getElementById('adminUserTable').innerHTML = `
            <table class="w-full text-left text-sm text-slate-300">
              <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                <tr>
                  <th class="p-3">Name</th>
                  <th class="p-3">Email</th>
                  <th class="p-3">Role</th>
                  <th class="p-3">Specialty / License</th>
                  <th class="p-3">Status</th>
                  <th class="p-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${users.map(u => `
                  <tr>
                    <td class="p-3 font-semibold text-white">${u.name}</td>
                    <td class="p-3 text-slate-400">${u.email}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${u.role === 'admin' ? 'bg-purple-500/20 text-purple-400' : 'bg-blue-500/20 text-blue-400'}">${u.role.toUpperCase()}</span></td>
                    <td class="p-3 text-slate-400">${u.specialty} (${u.license_no})</td>
                    <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${u.is_active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${u.is_active ? 'Active' : 'Deactivated'}</span></td>
                    <td class="p-3 text-right">
                      <button onclick="toggleUserStatus('${u.id}')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 rounded border border-slate-700">
                        ${u.is_active ? 'Deactivate' : 'Activate'}
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        if (logsRes.ok) {
          const logs = await logsRes.json();
          document.getElementById('adminLogsFeed').innerHTML = logs.map(l => `
            <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex justify-between items-center text-xs">
              <div>
                <div class="font-semibold text-slate-200">${l.action} — <span class="text-blue-400">${l.doctor_name}</span></div>
                <div class="text-slate-400 mt-1">${l.details}</div>
              </div>
              <div class="text-right">
                <div class="text-purple-400 font-mono">${l.tokens_used} tokens</div>
                <div class="text-slate-400 text-[10px]">${new Date(l.timestamp).toLocaleString()}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    async function toggleUserStatus(userId) {
      try {
        const res = await fetch(`/api/v1/admin/users/${userId}/toggle-status`, {
          method: 'POST',
          headers: getHeaders()
        });
        if (res.ok) loadAdminData();
      } catch (e) { console.error(e); }
    }
  </script>
</body>

</html>
